name: verify-release
on:
  push:
    paths:
      - proofs/**
  pull_request:
    paths:
      - proofs/**
  workflow_dispatch:

jobs:
  # Cross-repo receipt gating via C's reusable workflow (v1.0). Composite
  # actions under .github/actions/ do NOT resolve cross-repo; reusable
  # workflows are GitHub's supported sharing primitive. Tool checkout is
  # pinned by C inside the called workflow. Receipt integrity is re-checked
  # on every push touching proofs/ — signed by the maintainer wallet forever.
  # (Replaces the old step-level uses: .../actions/verify-release@v0.6 which
  # failed job preparation: run 33327435303 / 33327437042.)
  # A c106 repoint v0.9->v1.0: C shipped my c105 empty --require find as a
  # refusal (exit 2) in v1.0; my 8/8 local matrix (7 pinned cells + new
  # refuse-empty cell) ran green under v1.0 bytes BEFORE this repoint.
  verify:
    uses: tianzhicdev/ethkey-lite/.github/workflows/verify-release.yml@5ee65d9fdb28b8aa4d7083e715d6f46827ebd1ca  # v1.0 tag commit (A c106; was e7edefe v0.9 @ A c78)
    with:
      receipt: "proofs/secretgate-v1.2.5-proof.md"
      require: "0xFD4090e27C1f946Ff01a265cAa7d4ACA662acC15"
      ethkey-ref: "v1.0"

  # C's c23 caller-selftest class mirrored from THIS consumer: the reusable
  # workflow advertises a `signer` job output, but until this job NO consumer
  # anywhere asserted its VALUE from outside C's repo (the c22 gap-(a) class
  # one level up from the action findings-output I pinned in c26). CONTRACT
  # (C's c23 live finding, run 33336191895): the output carries EIP-55
  # checksummed casing while `require` matching inside the gate is
  # lowercase-compared -> compare CASE-FOLDED, never byte-equal. Failure
  # propagation (verify red -> this job SKIPPED, never runs empty) is proven
  # by C's red control run 33336194432.
  check-signer-output:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Assert reusable-workflow signer job output
        env:
          SIGNER: ${{ needs.verify.outputs.signer }}
          WANT: "0xFD4090e27C1f946Ff01a265cAa7d4ACA662acC15"
        run: |
          set -euo pipefail
          echo "caller saw outputs.signer = [$SIGNER]"
          test -n "$SIGNER" || { echo "FAIL: reusable workflow produced empty signer output"; exit 1; }
          GOT=$(printf '%s' "$SIGNER" | tr 'A-Z' 'a-z')
          WANT_FOLDED=$(printf '%s' "$WANT" | tr 'A-Z' 'a-z')
          test "$GOT" = "$WANT_FOLDED" || { echo "FAIL: signer output != A wallet addr (case-folded)"; exit 1; }
          echo "OK: signer job-output wiring proven from A's caller side (case-folded compare)"

  # Negative controls: the verifier's REJECTIONS are pinned as committed
  # attack fixtures (C's aae8009 pattern, mirrored here). A green "verified"
  # badge means nothing unless the same code fails these. Fixtures are signed
  # by the PUBLIC throwaway key (private key = 0x…0003, literally public),
  # so anyone can reproduce the attack locally — see README.
  negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (A c39/B c31)
        with:
          persist-credentials: false
      - name: Checkout ethkey-lite (verifier tool, pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (A c39/B c31)
        with:
          repository: tianzhicdev/ethkey-lite
          ref: v1.0
          path: .ethkey-tools
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (A c39/B c31)
        with:
          python-version: '3.11'
      - name: Run rejection matrix
        shell: bash
        env:
          A_ADDR: "0xFD4090e27C1f946Ff01a265cAa7d4ACA662acC15"
          PK3_ADDR: "0x6813Eb9362372EEF6200f3b1dbC3f819671cBA69"
        run: |
          set -euo pipefail
          pip install --quiet pycryptodome
          EK="python3 .ethkey-tools/ethkey.py"
          # c35 CONTENT PIN: the checkout ref alone can drift silently — if
          # the tag is ever force-moved or a repoint forgets this line, the
          # matrix would run an UNPINNED verifier (exactly the pinned-ref
          # drift class my c32/c34 probes proved real). Fail closed.
          # A c106: pin moved e582cb01 (v0.9) -> 26ef284d (v1.0) with the ref.
          echo "26ef284d3352e01e37b88a8adb2bc401d65b91b7fdcf0849632feb4164ca65aa  .ethkey-tools/ethkey.py" | sha256sum -c - --status \
            && echo "ok: verifier tool content-pinned (sha256 26ef284d..)" \
            || { echo "FAIL: ethkey.py content != pinned sha (tag moved?)"; exit 1; }
          fails=0
          expect() { # expect <exit|!exit> <desc> <cmd...>   ('exit' = nonzero expected)
            local want="$1" desc="$2"; shift 2
            local out rc=0
            out="$("$@" 2>&1)" || rc=$?
            if { [ "$want" = "exit" ] && [ "$rc" -eq 0 ]; } || \
               { [ "$want" = "!exit" ] && [ "$rc" -ne 0 ]; }; then
              echo "FAIL: $desc (rc=$rc)"; echo "$out" | tail -1; fails=$((fails+1))
            else
              echo "ok: $desc (rc=$rc)"
            fi
          }
          # FORGED fixture: valid pk=3 signature, signer header forged to A's addr.
          expect exit "F1 forged fixture bare verify must FAIL" \
            $EK verify proofs/c20-forged-signer-fixture.md
          expect exit "F2 forged fixture --require A must FAIL" \
            $EK verify proofs/c20-forged-signer-fixture.md --require "$A_ADDR"
          expect exit "F3 forged fixture --require TRUE signer must FAIL (header != recovered)" \
            $EK verify proofs/c20-forged-signer-fixture.md --require "$PK3_ADDR"
          # THROWAWAY fixture: genuine pk=3 receipt, header honest.
          expect !exit "T1 throwaway fixture bare verify must PASS" \
            $EK verify proofs/c20-throwaway-signed-fixture.md
          expect exit "T2 throwaway fixture --require A must FAIL" \
            $EK verify proofs/c20-throwaway-signed-fixture.md --require "$A_ADDR"
          expect !exit "T3 throwaway fixture --require true signer must PASS" \
            $EK verify proofs/c20-throwaway-signed-fixture.md --require "$PK3_ADDR"
          # Positive control: the real release receipt still verifies.
          expect !exit "P1 latest receipt (v1.2.5) --require A must PASS" \
            $EK verify proofs/secretgate-v1.2.5-proof.md --require "$A_ADDR"
          # A c106 (my c105 find, C's v1.0 fix): empty --require must REFUSE
          # at the args layer, never bless. Pinned forever = regression teeth.
          expect exit "X1 empty --require must REFUSE (exit 2, v1.0+)" \
            $EK verify proofs/secretgate-v1.2.5-proof.md --require ""
          if [ "$fails" -ne 0 ]; then echo "$fails negative-control asserts FAILED"; exit 1; fi
          echo "negative controls: 8/8 rejections behave as pinned"
