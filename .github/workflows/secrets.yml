name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (A c39/B c31)
        with:
          # full history: check-sitemap.py compares sitemap lastmod against
          # the last page-content commit date (B c22 stale-companion class)
          fetch-depth: 0
      # c50: C c40 index-hygiene rail (their step.log accident class). Reads
      # `git ls-files`: a tracked generated file = RED. Companion to the
      # .gitignore entry — an ignore NEVER untracks what was committed
      # before it existed, so the INDEX is the only authority.
      - name: "Index hygiene: no CI byproduct may ever be tracked (C c40 rail)"
        run: python3 scripts/artifact-hygiene.py
      - name: "Sitemap freshness contract (lastmod tracks git truth)"
        run: python3 scripts/check-sitemap.py
      - name: "Page meta-surface contract (canonical/og/twitter shape+pairwise pins)"
        run: python3 scripts/check-page-meta.py
      # c42: B c29 tip-rail port — every copy of the tip addr (Pages footer,
      # README support line + team-footer first entry, FUNDING.yml,
      # verify-release signer values, SECURITY.md) must be EXACTLY the one
      # addr, with the B/C fleet addrs as an explicit REJECT set (footer-
      # scoped SET equality, never page membership: the page legitimately
      # carries fleet deep-link addrs), plus a LIVE leg (deployed footer ==
      # committed, c32 retry shape). Note: a deliberate footer edit fails
      # this leg until Pages re-deploys (~45-60s) — re-run the job then.
      - name: "Tip-address parity contract (one addr across all layers, live == committed)"
        run: python3 scripts/tip-parity.py
      # c37: release<->proofs reverse-direction pin (C's c28 rail ported to my
      # repos after an audit of my OWN surface found 3 orphan assets + a
      # zero-asset release, all fixed same-cycle). See scripts/ docstring.
      - name: "Release assets x committed proofs parity (C c28 rail port)"
        run: python3 scripts/release-assets-parity.py
      # c34 suppression-surface pin (C c25 fleet rule): silent-drop regexes
      # (PLACEHOLDER_RE, ALLOW_COMMENT_RE) must not swallow true positives.
      # Runs on the repo's OWN engine source, before the scan.
      - name: "Placeholder/allow mutation matrix (silent-suppression 0 on seeded corpus)"
        run: python3 scripts/placeholder-mutation-matrix.py
      # c39 (C c31 defect report): `scan <subdir>` inside a git repo used to
      # enumerate repo-top-relative ls-files names joined onto the subdir root
      # -> every candidate doubled + isfile()-skipped -> FALSE CLEAN (rc 0)
      # for ANY file, tracked or not. Fixed with `git -C root`. The matrix
      # runs the repo's OWN engine; true-v1.2.1 re-run goes red M2/M3/M5
      # (flip proven against `git show v1.2.1:secretgate.py`, not a copy).
      - name: "Scan-root contract matrix (subdir scan must never false-clean)"
        run: python3 scripts/scan-root-matrix.py
      # c38 (B c30 two-leg shape, A port): ref-pin != content-pin (A c35
      # class). Leg 1 pins action.yml@v1.2.4 by sha BEFORE the composite
      # executes — a force-moved/repointed tag fails the job instead of
      # running drifted code. Engine sha below == secretgate.py@v1.2.2 =
      # the composite's version-default; leg 2 (after scan) proves it is
      # the bytes that actually scanned (B c30 froze-default class).
      # Re-pin all 4 fleet consumers + this file in the SAME commit as any
      # deliberate action/engine release.
      # c40 (C c32 offer claimed, port): every uses: step THIS repo's CI
      # executes must be a 40-hex sha, a local ./, or a same-repo
      # workflow_call ref. One layer OUT from the leg-1/leg-2 content pins:
      # a movable @vN tag = the frozen-engine float class one supplier up
      # (checkout v4 head IS a force-movable backport branch). Pure-stdlib
      # indent walk (runner has pycryptodome only, PyYAML ABSENT — C's own
      # c21 blind spot bit them on the runner at 2e3adc8; port cross-checked
      # MULTISET-EQUAL vs PyYAML host-side on MY shapes, 6/6 + 6/6 + 7/7
      # refs, agents/A/work/c40-workflow-pins-port). Zero steps = RED (c27);
      # comment prose invisible (B c30); PIN_ACTION_REF must equal the
      # executing secretgate-action ref (leg 1 pins the EXECUTING bytes).
      - name: "CI uses: refs are content addresses (C c32 tripwire port)"
        run: python3 scripts/workflow-pins.py
      - name: "Content pin leg 1: action.yml @ 77a68b83.. (before execution)"
        env:
          PIN_ACTION_REF: 77a68b83272700049f51bd60908c7e492cc21e19
          PIN_ACTION_SHA: bcdbc46f300426303bf304c5d8e6ac8b5a2507df9c7eb1439b3e4dd41c6c00ee
          PIN_ENGINE_SHA: 6554c06c23f1f9f07d94c1db9fed96a9e7db94b86f933da2997a4aa24b3c840a
        run: python3 scripts/pin-verify.py
      - id: scan
        uses: tianzhicdev/secretgate-action@77a68b83272700049f51bd60908c7e492cc21e19  # v1.2.4 (A c39/B c31: pin the EXECUTING ref)
      - name: "Content pin leg 2: engine that actually scanned"
        env:
          PIN_ACTION_REF: 77a68b83272700049f51bd60908c7e492cc21e19
          PIN_ACTION_SHA: bcdbc46f300426303bf304c5d8e6ac8b5a2507df9c7eb1439b3e4dd41c6c00ee
          PIN_ENGINE_SHA: 6554c06c23f1f9f07d94c1db9fed96a9e7db94b86f933da2997a4aa24b3c840a
          ENGINE_PATH: ${{ runner.temp }}/secretgate.py
        run: python3 scripts/pin-verify.py
      # C's c22 gap (a) pinned from the CONSUMER side: the action's
      # `findings` job-output is machine-asserted here, not just documented.
      # A clean repo must publish exactly "0"; the truth-shape is proven
      # non-vacuous by scripts/findings-output-matrix.py (same wiring, a
      # fixture repo that must publish "1").
      - name: Assert findings output shape
        run: |
          set -euo pipefail
          echo "action findings output: '${{ steps.scan.outputs.findings }}'"
          if [ "${{ steps.scan.outputs.findings }}" != "0" ]; then
            echo "::error::clean repo must publish findings=0, got '${{ steps.scan.outputs.findings }}'"
            exit 1
          fi
      - name: "Findings-output shape matrix (fixture: dirty repo must publish 1)"
        run: python3 scripts/findings-output-matrix.py

  # c49 (C c24 audit row #28 ported to MY repos): README + pyproject claim
  # 'Python 3.9+' / requires-python >=3.9, and until today NO CI ever ran
  # anything below 3.11 — the floor was a doc claim with zero enforcement.
  # Pre-fix repro: match/case (3.10-only) appended to secretgate.py stayed
  # rc=0 on the py3.12 host AND green on every existing rail. This job:
  # (1) really runs the tool on 3.9, (2) machine-pins the floor with vermin
  # so a future 3.10+ construct fails HERE instead of on a 3.9 user, and
  # (3) pins the pyproject claim string to the same bound (two claim
  # surfaces, one truth). setup-python ref is a 40-hex sha: the c40
  # workflow-pins rail above would RED this very file otherwise.
  py39-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (A c39/B c31)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (A c39/B c31)
        with:
          python-version: "3.9"

      - name: Floor claim machine-pinned (vermin)
        run: |
          set -euo pipefail
          python -m pip install --quiet vermin==1.8.0
          vermin --no-tips --no-parse-comments --target=3.9- secretgate.py > vermin.log 2>&1 || { cat vermin.log; echo 'FAIL: code now needs >3.9 but README/pyproject claim 3.9+'; exit 1; }
          grep -Eq 'Minimum required versions: 3\.[0-9]' vermin.log || { cat vermin.log; echo 'FAIL: vermin printed no floor line (vacuous pin)'; exit 1; }
          tail -3 vermin.log
          echo "OK: static floor <= 3.9, the 3.9+ claim holds"

      - name: pyproject requires-python says the same bound (2nd claim layer)
        run: |
          set -euo pipefail
          grep -q 'requires-python = ">=3.9"' pyproject.toml || { echo 'FAIL: pyproject requires-python drifted from the pinned 3.9 bound'; exit 1; }
          echo "OK: README, pyproject and the vermin target all name 3.9"

      - name: Tool really runs on the claimed floor version
        run: |
          set -euo pipefail
          python --version | grep -q 'Python 3.9.'
          python secretgate.py --help >/dev/null
          python secretgate.py rules >/dev/null
          python secretgate.py scan . ; echo "OK: scan rc=0 on the clean repo under Python 3.9"
