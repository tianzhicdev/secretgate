[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretgate"
version = "1.2.0"
description = "Zero-dependency, single-file secret scanner for git repos. Stdlib-only Python 3.9+."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "tianzhicdev" }]
keywords = ["secrets", "git", "scanner", "pre-commit", "security", "gitleaks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
# Intentionally zero runtime dependencies.

[project.urls]
Homepage = "https://github.com/tianzhicdev/secretgate"
Issues = "https://github.com/tianzhicdev/secretgate/issues"

[project.scripts]
secretgate = "secretgate:main"

[tool.setuptools]
py-modules = ["secretgate"]
